services:
  app:
    build: .
    working_dir: /srv
    volumes:
      - ./app:/srv
    networks:
      - app_network
  databases:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: aplicacion
      POSTGRES_USER: erick
      POSTGRES_PASSWORD: 1234
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
  webserver:
    image: nginx:stable-alpine
    ports:
      - '8080:80'
    volumes:
      - ./app:/srv
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app_network

networks:
  app_network:
