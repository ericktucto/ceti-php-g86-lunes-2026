services:
  app:
    build: .
    working_dir: /srv
    volumes:
      - ./app:/srv
    networks:
      - app_network
  databases:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: aplicacion
      POSTGRES_USER: erick
      POSTGRES_PASSWORD: 1234
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
  webserver:
    image: nginx:stable-alpine
    ports:
      - '8080:80'
    volumes:
      - ./app:/srv
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app_network
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ./redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app_network
  queue:
    build: .
    command: php artisan queue:work
    working_dir: /srv
    volumes:
      - ./app:/srv
    depends_on:
      - redis
    networks:
      - app_network

networks:
  app_network:
